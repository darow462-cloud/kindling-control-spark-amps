name: KindlingControl 0.8.0 Spark 2 Reference Preset Smoke

on:
  push:
    branches:
      - feature/v0.8.0-reference-preset-generator
    paths:
      - '.github/workflows/reference-tone-smoke.yml'
      - 'src/**'
      - 'desktop/**'
      - 'test/**'
      - 'tools/patch-stemyla-controls.py'
      - 'tools/install-roformer-transfer.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: App/IPC/browser bridge tests (no WASM compilation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
          node --check src/app/roformer-controls.js
          node --check src/app/roformer-transfer.js
          node --check src/app/roformer-health.js
          node --check src/app/stem-trim-utils.js
          node --check src/app/reference-preset.js
          node --check src/app/audio-panel.js
          node --check src/app/app.js
          node --check src/app/stem-source-clip.js
          node --check src/app/stem-export-clip.js
          node --check desktop/stem-clip-store.js
          node --check desktop/roformer-transfer-bridge.js
          node --check tools/install-roformer-transfer.js
          python3 -m py_compile tools/patch-stemyla-controls.py
