name: KindlingControl 0.7 RoFormer fast Windows Portable (verified assets)

# Fast packaging after source and model-inference code were built from pinned
# upstream code in run 44881816942 (WASM), and normalized Demucs was compiled
# in run 44856514299. Neither upstream weights nor audio are redistributed.
on:
  push:
    branches:
      - feature/v0.7-roformer-webgpu-studio
    paths:
      - '.github/workflows/roformer-portable-fast.yml'
      - 'desktop/**'
      - 'src/**'
      - 'test/**'
      - 'tools/make-roformer-builder-config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verified-portable:
    name: Bundle pinned WASM, SHA-verified normalized Demucs, and KindlingControl
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and run app/IPC/security regression tests
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/roformer-studio.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/app/stem-panel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Built from pinned Stemyla commit b2a771808d36f9a8d2f333528805d0ee2c1040a8;
      # its WebAssembly job passed even though the downstream Windows job
      # originally failed on a Windows short/long-path alias in a unit test.
      - uses: actions/download-artifact@v4
        with:
          repository: darow462-cloud/kindling-control-spark-amps
          run-id: 44881816942
          name: roformer-pinned-webgpu-assets
          github-token: ${{ github.token }}
          path: build/roformer-package

      # Source-built normalized Demucs from pinned demucs-rs v0.3.5 and the
      # tested 0.6.2 global-normalizer patch. Its published Portable is an
      # embedded 7z SFX archive containing resources/demucs/demucs.exe.
      - uses: actions/download-artifact@v4
        with:
          repository: darow462-cloud/kindling-control-spark-amps
          run-id: 44856514299
          name: KindlingControl-Stems062-GlobalNorm-Win-x64
          github-token: ${{ github.token }}
          path: build/normalized062

      - name: Verify independent WASM workers and extract the pinned native engine
        shell: pwsh
        run: |
          Move-Item build/roformer-package/studio build/roformer-studio
          Move-Item build/roformer-package/notices build/roformer-notices
          $wasm = @(Get-ChildItem build/roformer-studio -Recurse -Filter *.wasm -File)
          if ($wasm.Count -ne 4) { throw "Expected 4 pinned WASM modules, got $($wasm.Count)" }
          $portable = @(Get-ChildItem build/normalized062 -Recurse -Filter *.exe -File)
          if ($portable.Count -ne 1) { throw "Expected exactly one 0.6.2 Portable EXE" }
          $seven = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $seven)) { throw "7-Zip is missing from Windows runner" }
          $destination = Join-Path $PWD "build/normalized-extracted"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          & $seven x $portable[0].FullName "-o$destination" "resources/demucs/demucs.exe" "resources/demucs/LICENSE.txt" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $native = Join-Path $destination "resources/demucs/demucs.exe"
          $license = Join-Path $destination "resources/demucs/LICENSE.txt"
          if (!(Test-Path $native) -or !(Test-Path $license)) { throw "Normalized native engine missing from verified Portable" }
          $hash = (Get-FileHash $native -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "4bb4d08b86861dd0146de283d20b0539856a186b07345b1f7e619dbf9b6fee95") {
            throw "Normalized Demucs SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force -Path build/bin | Out-Null
          Copy-Item $native build/bin/demucs.exe
          Copy-Item $license build/bin/LICENSE.txt
          node tools/make-roformer-builder-config.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/stamp-version.js 0.7.0-roformer.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build independent Windows Portable with two real models
        shell: pwsh
        run: >
          npx electron-builder --config build/roformer-electron-builder.json
          --win portable --x64 --publish never
          --config.extraMetadata.version=0.7.0-roformer.2
          --config.productName="KindlingControl RoFormer Studio 0.7 Test"
          --config.appId=dev.darow462.kindlingcontrol.roformer07

      - uses: actions/upload-artifact@v4
        with:
          name: KindlingControl-RoFormer07-Verified-Portable-Win-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
