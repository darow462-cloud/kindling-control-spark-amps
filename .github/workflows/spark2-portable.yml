name: KindlingControl 0.3 Fast Windows Portable (test build)

on:
  push:
    branches:
      - fix/v0.3-fast-ab-undo
    paths:
      - ".github/workflows/spark2-portable.yml"
      - "src/**"
      - "test/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Build standalone Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Stamp development build version
        run: node tools/stamp-version.js 0.3.1-fast.1
      - name: Build portable Windows exe
        shell: pwsh
        run: >
          npx electron-builder --win portable --x64 --publish never
          --config.extraMetadata.version=0.3.1-fast.1
          --config.productName="KindlingControl Editor 0.3 Fast Test"
          --config.appId=dev.bluedog.kindlingcontrol.editor03fast
      - uses: actions/upload-artifact@v4
        with:
          name: KindlingControl-Editor03-Fast-Portable-Win-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
